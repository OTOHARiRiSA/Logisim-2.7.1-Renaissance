# Startup.java
#
argTwoSubstitutionError = -sub 选项后必须跟两个参数。
argDuplicateSubstitutionError = 不能多次替换同一个文件。
ttyNeedsFileError = 使用 -tty 时，必须在命令行中指定文件名。
argTtyOption      = -tty format                 以指定格式运行，无图形界面
argSubOption      = -sub file1 file2            加载项目时，用 file2 替换库文件 file1
argLoadOption     = -load file                  将存储器映像载入 RAM（仅与 -tty 配合使用）
loadNeedsFileError = 使用 -load 时，必须在命令行中指定文件名。
loadNeedsTtyError  = -load 选项只能与 -tty 配合使用。
loadMultipleError  = -load 选项只能指定一次。
ttyFormatError = -tty 需要以下至少一种格式：halt、speed、stats、table、tty。

argOneTemplateError = 只能指定一个模板。
argUsage = 用法：java %s [选项] [文件名…]
argOptionHeader = 选项：
argEmptyOption    = -empty                      使用空白模板
argPlainOption    = -plain                      使用 Logisim 标准模板
argTemplateOption = -template file              使用指定文件作为模板
argGatesOption    = -gates shaped|rectangular   使用指定的逻辑门符号
argLocaleOption   = -locale str                 使用指定的语言区域
argAccentsOption  = -accents yes|no             使用重音字符或对应的 ASCII 字符
argNoSplashOption = -nosplash                   启动时隐藏启动画面
argVersionOption  = -version                    显示版本号并退出
argHelpOption     = -help                       显示此帮助并退出
argClearOption    = -clearprops                 启动时清除应用程序首选项
argGatesOptionError = -gates 选项的参数必须是 shaped 或 rectangular。
argAccentsOptionError = -accents 选项的参数必须是 yes 或 no。
templateMissingError = 模板文件“%s”不存在。
templateCannotReadError = 没有读取模板文件“%s”的权限。
invalidLocaleError = 不支持指定的语言区域。
invalidLocaleOptionsHeader = 支持的语言区域：
startupCloseButton = 关闭
startupQuitButton = 退出
