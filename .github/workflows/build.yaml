name: Build Logisim Renaissance

on:
  push:
    branches:
      - feature/cd
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2025
          - macos-15
          - ubuntu-24.04
        
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build JAR (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE/dist"
          python scripts/create-jar.py -d "$env:GITHUB_WORKSPACE/dist"

      - name: Build JAR (macOS)
        if: runner.os == 'macOS'
        shell: 'zsh -e {0}'
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          python scripts/create-jar.py -d "$GITHUB_WORKSPACE/dist"

      - name: Build JAR (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          python scripts/create-jar.py -d "$GITHUB_WORKSPACE/dist"

      - name: Upload JAR
        uses: actions/upload-artifact@v7
        with:
          name: logisim-${{ matrix.os }}
          path: dist/*.jar
          if-no-files-found: error
